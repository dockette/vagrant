name: "Docker"

on:
  workflow_dispatch:

  workflow_run:
    workflows: [Test]
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    name: "Build (${{ matrix.item }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - item: "debian-13"
          - item: "debian-13-systemd"
          - item: "debian-12"
          - item: "debian-12-systemd"
          - item: "debian-11"
          - item: "debian-11-systemd"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # latest is also tagged <VERSION>, other tags <tag>-<VERSION>
      - name: Read VERSION
        id: version
        env:
          TAG: ${{ matrix.item }}
        run: |
          v="$(cat VERSION)"
          grep -Eqx '[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?' <<<"$v" || { echo "::error file=VERSION::expected YYYY.MM.DD or YYYY.MM.DD.N, got '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = latest ]; then echo "tag=$v"; else echo "tag=$TAG-$v"; fi >> "$GITHUB_OUTPUT"

      # A build without a push needs no credentials. Pull requests and Dependabot
      # have no access to the secrets, and the login would fail for them.
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "${{ matrix.item }}"
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            dockette/vagrant:${{ matrix.item }}
            dockette/vagrant:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          platforms: "linux/amd64,linux/arm64"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags the commit and publishes a GitHub release for VERSION the first
  # time it reaches master with the images pushed (make release bumps it).
  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release if VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists"
            exit 0
          fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --generate-notes

  docs:
    name: "Docs"
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/vagrant"
